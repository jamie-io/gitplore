<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---- Tiers: mirrors capability.service.ts, plus the new per-tier knobs this look needs ----
const TIERS = {
  low:    { pr: 1,   shadows: false, map: 0,    plants: 320,  canopy: 40,  flies: 40,  detail: 0, post: false },
  medium: { pr: 1.5, shadows: true,  map: 1024, plants: 900,  canopy: 110, flies: 90,  detail: 1, post: false },
  high:   { pr: 2,   shadows: true,  map: 2048, plants: 1400, canopy: 200, flies: 160, detail: 2, post: true },
};
function probe() {
  const gl = document.createElement('canvas').getContext('webgl2');
  const dbg = gl && gl.getExtension('WEBGL_debug_renderer_info');
  return { webgl2: !!gl, renderer: dbg ? String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)) : '', cores: navigator.hardwareConcurrency || 4 };
}
function detectTier(c) {
  if (!c.webgl2 || /swiftshader|llvmpipe|software|basic render/i.test(c.renderer) || c.cores <= 2) return 'low';
  return !/intel|uhd graphics|hd graphics/i.test(c.renderer) && c.cores >= 8 ? 'high' : 'medium';
}
const caps = probe();
let detected = detectTier(caps), userTier = null, steppedDown = false;
const stepDown = (t) => (t === 'high' ? 'medium' : 'low');
const currentTier = () => userTier ?? (steppedDown ? stepDown(detected) : detected);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- Palette (mood.ts DSCHUNGEL + turn-1 palette) ----
const C = {
  zenith: 0x4f8580, horizon: 0x86ad98, glow: 0xe8ffc0, below: 0x3d5a45, fog: 0x7ba592,
  hemiSky: 0x98c6a2, hemiGround: 0x34482a, sun: 0xf2ffd0, amber: 0xe0a13c, wood: 0x5a3d27,
  slop: 0x9a3f8d,
};

const renderer = new THREE.WebGLRenderer({ antialias: detected !== 'low', powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(C.fog, 0.03);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);

const U = { uTime: { value: 0 }, uDetail: { value: 2 }, uPlayer: { value: new THREE.Vector3() },
  uSunView: { value: new THREE.Vector3() }, uSunColor: { value: new THREE.Color(C.sun) } };
const sunDir = new THREE.Vector3(-0.35, 0.87, -0.34).normalize();

const NOISE = `
float hash12(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x),mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x),f.y);}
`;

// ---- Sky dome + environment for reflections ----
function skyMaterial() {
  return new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uZ: { value: new THREE.Color(C.zenith) }, uH: { value: new THREE.Color(C.horizon) },
      uB: { value: new THREE.Color(C.below) }, uG: { value: new THREE.Color(C.glow) }, uS: { value: sunDir } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position = p.xyww; }`,
    fragmentShader: `uniform vec3 uZ,uH,uB,uG,uS; varying vec3 vDir;
      void main(){ vec3 d=normalize(vDir); vec3 c=mix(uH,uZ,smoothstep(0.,.65,d.y)); c=mix(uB,c,smoothstep(-.25,0.,d.y));
      float s=max(dot(d,uS),0.); c+=uG*(pow(s,6.)*.45+pow(s,300.)*3.); gl_FragColor=vec4(c,1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      }`,
  });
}
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), skyMaterial());
scene.add(sky);
{
  const envScene = new THREE.Scene();
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), skyMaterial()));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.02).texture;
  scene.environmentIntensity = 0.55;
}

// ---- Lights ----
scene.add(new THREE.HemisphereLight(C.hemiSky, C.hemiGround, 0.85));
const sun = new THREE.DirectionalLight(C.sun, 2.3);
sun.position.copy(sunDir).multiplyScalar(40).add(new THREE.Vector3(0, 0, -12));
sun.target.position.set(0, 0, -12);
Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

// ---- Terrain ----
const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };
const pathX = (z) => Math.sin(z * 0.09) * 1.6;
function heightAt(x, z) {
  const flat = smooth(1.4, 3.6, Math.abs(x - pathX(z)));
  const base = 0.35 * Math.sin(x * 0.21) * Math.cos(z * 0.17) + 0.18 * Math.sin(x * 0.53 + z * 0.31) + 0.08 * Math.sin(x * 1.3 - z * 1.1);
  return base * flat + Math.pow(Math.max(0, Math.abs(x) - 11), 1.4) * 0.18 + Math.pow(Math.max(0, -z - 33), 1.2) * 0.4;
}
{
  const g = new THREE.PlaneGeometry(90, 90, 180, 180).rotateX(-Math.PI / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  const moss = new THREE.Color(0x3b5a2f), soil = new THREE.Color(0x4a3f2a), dark = new THREE.Color(0x26361f), tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i) - 12;
    pos.setZ(i, z); pos.setY(i, heightAt(x, z));
    const n = 0.5 + 0.5 * Math.sin(x * 0.37 + Math.cos(z * 0.29) * 2.1) * Math.cos(z * 0.23 - x * 0.11);
    const nearPath = 1 - smooth(0.8, 2.8, Math.abs(x - pathX(z)));
    tmp.copy(moss).lerp(dark, n * 0.7).lerp(soil, nearPath * 0.75);
    col.set([tmp.r, tmp.g, tmp.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  g.computeVertexNormals();
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92 });
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, { uTime: U.uTime, uDetail: U.uDetail });
    s.vertexShader = 'varying vec3 vWP;\n' + s.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;');
    s.fragmentShader = 'uniform float uTime; uniform float uDetail; varying vec3 vWP;\n' + NOISE + `
      float wetAt(vec2 p){ if(uDetail<.5) return 0.; float n=vnoise(p*.3)*.65+vnoise(p*1.25)*.35; return smoothstep(.6,.72,n); }
    ` + s.fragmentShader
      .replace('#include <color_fragment>', `#include <color_fragment>
        float wet=wetAt(vWP.xz);
        if(uDetail>.5){ diffuseColor.rgb*=.82+.36*vnoise(vWP.xz*3.7); }
        if(uDetail>1.5){ float sp=smoothstep(.78,.84,vnoise(vWP.xz*8.5)); diffuseColor.rgb=mix(diffuseColor.rgb,vec3(.30,.21,.10),sp*.6*(1.-wet)); }
        diffuseColor.rgb*=mix(1.,.55,wet);`)
      .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
        roughnessFactor=mix(roughnessFactor,.08,wet);`)
      .replace('#include <lights_fragment_end>', `#include <lights_fragment_end>
        if(uDetail>.5){ float dap=smoothstep(.32,.68,vnoise(vWP.xz*.42+vec2(uTime*.05,uTime*.03))*.7+vnoise(vWP.xz*1.1-uTime*.04)*.3);
        reflectedLight.directDiffuse*=.45+.75*dap; reflectedLight.directSpecular*=.45+.75*dap; }`);
  };
  const ground = new THREE.Mesh(g, m);
  ground.receiveShadow = true;
  scene.add(ground);
}

// ---- Cliff, waterfall, pool, mist ----
{
  const g = new THREE.BoxGeometry(70, 18, 6, 50, 14, 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (z > 0) p.setZ(i, z + Math.sin(x * 0.7) * 0.8 + Math.sin(y * 1.1 + x * 0.3) * 0.6 + Math.sin(x * 2.3 + y * 1.7) * 0.25);
    if (y > 8) p.setY(i, y + Math.sin(x * 0.5) * 1.2 + Math.cos(x * 1.4) * 0.5);
  }
  g.computeVertexNormals();
  const cliff = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x3b4a40, roughness: 0.95 }));
  cliff.position.set(0, 8, -39);
  cliff.castShadow = cliff.receiveShadow = true;
  scene.add(cliff);
}
const waterfallMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 } }]),
  vertexShader: `#include <fog_pars_vertex>
    varying vec2 vUv; void main(){ vUv=uv; vec4 mvPosition=modelViewMatrix*vec4(position,1.); gl_Position=projectionMatrix*mvPosition;
    #include <fog_vertex>
    }`,
  fragmentShader: `uniform float uTime; varying vec2 vUv;
    #include <fog_pars_fragment>
    ${NOISE}
    void main(){ float n=vnoise(vec2(vUv.x*16.,vUv.y*2.5+uTime*2.4))*.6+vnoise(vec2(vUv.x*40.,vUv.y*6.+uTime*3.1))*.4;
      vec3 c=mix(vec3(.55,.78,.72),vec3(1.25,1.35,1.3),smoothstep(.35,.8,n));
      float a=smoothstep(0.,.12,vUv.x)*smoothstep(1.,.88,vUv.x)*(.55+.45*n)*smoothstep(0.,.05,vUv.y);
      gl_FragColor=vec4(c,a);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
      #include <fog_fragment>
    }`,
});
const waterfall = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 15, 1, 1), waterfallMat);
waterfall.position.set(0.6, 7.2, -35.2);
scene.add(waterfall);
{
  const pool = new THREE.Mesh(new THREE.CircleGeometry(4.2, 48).rotateX(-Math.PI / 2),
    new THREE.MeshStandardMaterial({ color: 0x1f4a45, roughness: 0.06, metalness: 0.1 }));
  pool.position.set(0.6, heightAt(0.6, -33) + 0.05, -33);
  pool.receiveShadow = true;
  scene.add(pool);
}
function softSprite() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.4, 'rgba(255,255,255,.35)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const sprite = softSprite();
const mist = [];
for (let i = 0; i < 14; i++) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sprite, color: 0xe6f5ef, transparent: true, opacity: 0.22, depthWrite: false }));
  s.userData = { ph: Math.random() * 6.28, x: 0.6 + (Math.random() - 0.5) * 5 };
  s.scale.setScalar(3 + Math.random() * 3);
  scene.add(s); mist.push(s);
}

// ---- Light shafts ----
const shaftMat = (seed) => new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false, side: THREE.DoubleSide,
  uniforms: { uTime: U.uTime, uDetail: U.uDetail, uSeed: { value: seed }, uC: { value: new THREE.Color(C.sun) } },
  vertexShader: `varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv=uv; vec4 mv=modelViewMatrix*vec4(position,1.);
    vN=normalize(normalMatrix*normal); vV=normalize(-mv.xyz); gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `uniform float uTime,uDetail,uSeed; uniform vec3 uC; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){ float f=pow(abs(dot(vN,vV)),2.2); float a=f*sin(vUv.y*3.14159)*(.75+.25*sin(uTime*.6+uSeed*3.))*(uDetail>.5?.16:.09);
    gl_FragColor=vec4(uC*a,1.); }`,
});
[[0, -6, 1.6], [-5, -14, 1.2], [4, -20, 2.0], [7, -4, 1.3], [-8, -3, 1.9], [2, -28, 1.7], [-3, -24, 1.2]].forEach(([x, z, r], i) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.35, r, 26, 20, 1, true), shaftMat(i));
  m.position.set(x, 13, z);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDir);
  m.position.addScaledVector(sunDir, 0);
  scene.add(m);
});

// ---- Foliage: one leaf-cluster geometry, instanced, wind + push + translucency ----
function leafGeometry() {
  const parts = [];
  const leaves = 7;
  for (let i = 0; i < leaves; i++) {
    const g = new THREE.PlaneGeometry(0.34, 1.25, 2, 8);
    const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const y = p.getY(k) + 0.625, t = y / 1.25;
      p.setX(k, p.getX(k) * Math.sin(Math.PI * Math.min(t * 1.1, 1)) * (1 - t * 0.2));
      p.setY(k, y);
      p.setZ(k, t * t * 0.45 - Math.abs(p.getX(k)) * 0.35);
    }
    g.rotateX(-0.55 - (i % 3) * 0.18);
    g.rotateY((i / leaves) * Math.PI * 2 + (i % 2) * 0.3);
    parts.push(g);
  }
  const m = mergeGeometries(parts);
  m.computeVertexNormals();
  return m;
}
function foliageMaterial(push) {
  const m = new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide, roughness: 0.62 });
  m.onBeforeCompile = (s) => {
    Object.assign(s.uniforms, U, { uPush: { value: push } });
    s.vertexShader = 'uniform float uTime; uniform vec3 uPlayer; uniform float uPush;\n' + s.vertexShader.replace('#include <project_vertex>', `
      vec4 wP = modelMatrix * instanceMatrix * vec4(transformed,1.0);
      vec3 root = (modelMatrix * instanceMatrix * vec4(0.,0.,0.,1.)).xyz;
      float h = max(wP.y-root.y,0.);
      float sw = sin(uTime*1.25+root.x*.6+root.z*.45);
      wP.x += (sw*.055 + sin(uTime*3.3+root.z*2.1)*.012)*h*h;
      wP.z += sw*.03*h*h;
      vec2 d = root.xz-uPlayer.xz; float pd = length(d);
      wP.xz += d/(pd+1e-3)*smoothstep(1.4,.15,pd)*h*.5*uPush;
      vec4 mvPosition = viewMatrix*wP;
      gl_Position = projectionMatrix*mvPosition;`);
    s.fragmentShader = 'uniform vec3 uSunView; uniform vec3 uSunColor; uniform float uDetail;\n' + s.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      if(uDetail>.5){ vec3 e2f=normalize(-vViewPosition); float tr=pow(max(dot(e2f,uSunView),0.),3.);
      totalEmissiveRadiance += diffuseColor.rgb*uSunColor*tr*(uDetail>1.5?1.1:.7); }`);
  };
  return m;
}
const rng = ((a) => () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; })(7);
const leafGeo = leafGeometry();
const MAXP = 1800, MAXC = 200;
const plants = new THREE.InstancedMesh(leafGeo, foliageMaterial(1), MAXP);
const canopy = new THREE.InstancedMesh(leafGeo, foliageMaterial(0), MAXC);
{
  const o = new THREE.Object3D(), c = new THREE.Color();
  const greens = [0x3f7a34, 0x4f8a3a, 0x2f6a36, 0x5d8f3c, 0x356f45];
  for (let i = 0; i < MAXP; i++) {
    let x, z, tries = 0;
    do { x = (rng() - 0.5) * 34; z = 9 - rng() * 42; tries++; } while (Math.abs(x - pathX(z)) < 1.9 && tries < 20);
    const s = 0.55 + Math.pow(rng(), 1.6) * (Math.abs(x - pathX(z)) > 5 ? 2.0 : 0.55);
    o.position.set(x, heightAt(x, z) - 0.05, z);
    o.rotation.set((rng() - 0.5) * 0.25, rng() * 6.28, (rng() - 0.5) * 0.25);
    o.scale.set(s, s * (0.8 + rng() * 0.5), s);
    o.updateMatrix(); plants.setMatrixAt(i, o.matrix);
    c.setHex(greens[i % greens.length]).offsetHSL((rng() - 0.5) * 0.03, 0, (rng() - 0.5) * 0.08);
    plants.setColorAt(i, c);
  }
  for (let i = 0; i < MAXC; i++) {
    const side = rng() < 0.5 ? -1 : 1;
    const x = side * (3.5 + rng() * 14), z = 8 - rng() * 44;
    const s = 2.5 + rng() * 3;
    o.position.set(x, 7 + rng() * 4, z);
    o.rotation.set(Math.PI + (rng() - 0.5) * 0.6, rng() * 6.28, (rng() - 0.5) * 0.6);
    o.scale.setScalar(s); o.updateMatrix(); canopy.setMatrixAt(i, o.matrix);
    c.setHex(greens[(i + 2) % greens.length]).offsetHSL(0, 0, -0.05);
    canopy.setColorAt(i, c);
  }
  plants.castShadow = plants.receiveShadow = true;
  canopy.castShadow = true;
  scene.add(plants, canopy);
}
// Trunks
{
  const bark = new THREE.MeshStandardMaterial({ color: 0x3a3226, roughness: 0.95 });
  for (let i = 0; i < 18; i++) {
    const side = i % 2 ? -1 : 1;
    const x = side * (4 + rng() * 11), z = 7 - rng() * 40;
    const h = 10 + rng() * 4;
    const g = new THREE.CylinderGeometry(0.22, 0.5, h, 9, 10);
    const p = g.attributes.position;
    for (let k = 0; k < p.count; k++) {
      const y = p.getY(k);
      p.setX(k, p.getX(k) + Math.sin(y * 0.35 + i) * 0.35 + Math.sin(p.getZ(k) * 9 + y * 2) * 0.03);
      p.setZ(k, p.getZ(k) + Math.cos(y * 0.3 + i) * 0.25);
    }
    g.computeVertexNormals();
    const t = new THREE.Mesh(g, bark);
    t.position.set(x, heightAt(x, z) + h / 2 - 0.3, z);
    t.castShadow = t.receiveShadow = true;
    scene.add(t);
  }

  }
  let glow = 0;
  if (ignite >= 0) {
    ignite += dt;
    if (!carried) {
      glow = reducedMotion ? 1 : Math.min(1, ignite / 0.7) * (ignite < 0.7 ? (Math.sin(ignite * 70) > -0.2 ? 1 : 0.15) : 1);
      if (ignite > 0.9) { carried = true; carryT = 0; lanternStart.copy(lanternBody.position); hand.attach(lanternBody); lanternStart.copy(lanternBody.position); }
    } else glow = lit ? 1 : 0;
  }
  if (carried && carryT < 1) { carryT = Math.min(1, carryT + dt * 2.2); lanternBody.position.lerpVectors(lanternStart, new THREE.Vector3(), 1 - Math.pow(1 - carryT, 3)); }
  const flicker = 1 + 0.07 * Math.sin(t * 13.1) + 0.04 * Math.sin(t * 23.7 + 1.3);
  const glowNow = glow * flicker;
  lanternLight.intensity = glowNow * 7;
  glassMat.emissiveIntensity = glowNow * 3.2;
  lanternBody.getWorldPosition(lanternWorld);
  const R = lit && carried ? LIGHT_R : lit ? 2.5 : 0;
  const inLight = (x, z) => R > 0 && Math.hypot(x - lanternWorld.x, z - lanternWorld.z) < R;

  // vines
  for (const v of vines) {
    const clear = inLight(v.x, v.z);
    v.grow += clear ? -dt * 2.6 : dt * 0.3;
    v.grow = Math.min(1, Math.max(0.06, v.grow));
    const e = v.grow * v.grow * (3 - 2 * v.grow);
    v.g.scale.set(1, e, 1);
    v.g.rotation.z = Math.sin(t * 0.8 + v.ph) * 0.05 * e + (clear ? Math.sin(t * 14 + v.ph) * 0.02 : 0);
    v.g.rotation.x = (1 - e) * 0.4;
    v.mat.emissiveIntensity = 0.3 + 0.18 * Math.sin(t * 2 + v.ph);
  }
  // tags
  for (const g of tags) {
    const on = inLight(g.x, g.z);
    g.w = Math.min(1, Math.max(0, g.w + (on ? dt * 2.2 : -dt * 1.2)));
    const e = g.w * g.w * (3 - 2 * g.w);
    g.tag.rotation.y = e * Math.PI + Math.sin(t * 1.1 + g.ph) * 0.08;
    g.hang.rotation.z = Math.sin(t * 0.7 + g.ph) * 0.025;
    if (on && g.w > 0.95 && !g.seen) { g.seen = true; toast('Tag dreht sich um · Tag flipped to original'); }
  }
  // cards
  for (const c of cards) {
    const on = inLight(c.g.position.x, c.g.position.z) || (R > 0 && Math.hypot(c.g.position.x - lanternWorld.x, c.g.position.z - lanternWorld.z) < R + 1);
    c.w = reducedMotion ? (on ? 1 : 0) : Math.min(1, Math.max(0, c.w + (on ? dt * 1.3 : -dt * 0.7)));
    c.m.uniforms.uWipe.value = c.w;
    if (c.w > 0.99 && !c.seen) { c.seen = true; toast(`Original: ${c.v.orig}`); }
  }
  // posts
  for (const p of posts) {
    if (Math.hypot(p.x - player.position.x, p.z - player.position.z) < 1.8) p.lit = Math.min(1, p.lit + dt * 3);
    p.cap.material.color.setRGB(0.23 + p.lit * 2.6, 0.18 + p.lit * 1.5, 0.12 + p.lit * 0.45);
  }
  // fireflies
  for (let i = 0; i < flies.length; i++) {
    const f = flies[i];
    const near = R > 0 && f.h.distanceTo(player.position) < 9;
    if (near) tmpV.set(lanternWorld.x + Math.cos(t * f.sp + f.ph) * (0.9 + (i % 5) * 0.25), lanternWorld.y + Math.sin(t * 1.3 + f.ph) * 0.5, lanternWorld.z + Math.sin(t * f.sp + f.ph) * (0.9 + (i % 5) * 0.25));
    else tmpV.set(f.h.x + Math.cos(t * f.sp * 0.5 + f.ph) * 0.6, f.h.y + Math.sin(t * 0.9 + f.ph) * 0.3, f.h.z + Math.sin(t * f.sp * 0.4 + f.ph) * 0.6);
    f.p.lerp(tmpV, Math.min(1, dt * (near ? 1.4 : 0.8)));
    flyPos.set([f.p.x, f.p.y, f.p.z], i * 3);
  }
  flyGeo.attributes.position.needsUpdate = true;
  flyMat.opacity = 0.65 + 0.35 * Math.sin(t * 3);
  // mist
  mist.forEach((m, i) => { const k = (t * 0.25 + m.userData.ph) % 3; m.position.set(m.userData.x + Math.sin(t * 0.3 + i) * 0.4, heightAt(0.6, -33) + 0.4 + k * 0.9, -33.8 + k * 0.7); m.material.opacity = 0.22 * (1 - k / 3); });

  // camera
  const target = tmpV.copy(player.position).add(new THREE.Vector3(0, 1.35, 0));
  const dist = 5.2;
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist + 0.6, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(target);
  camera.updateMatrixWorld();
  U.uSunView.value.copy(sunDir).transformDirection(camera.matrixWorldInverse);

  // HUD
  promptEl.innerHTML = carried ? `<kbd>E</kbd> ${lit ? 'Laterne löschen' : 'Laterne anzünden'}` : '';
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.style.opacity = 0; }

  if (usePost) composer.render(); else renderer.render(scene, camera);

  // fps + one-time step-down, like CapabilityService.sampleFrame
  frames++; acc += dt;
  if (acc > 0.5) { fps = Math.round(frames / acc); frames = 0; acc = 0;
    statsEl.textContent = `${fps} fps · Stufe ${currentTier()}${userTier ? ' (manuell)' : ' (auto)'} · ${caps.renderer ? caps.renderer.replace(/^ANGLE \(|\)$/g, '').split(',').slice(1, 2).join('').trim().slice(0, 40) : 'GPU unbekannt'}`; }
  if (started && userTier === null && !steppedDown && currentTier() !== 'low') {
    sampleMs += dt * 1000; sampleN++;
    if (sampleMs > 3000) { if (sampleMs / sampleN > 24) { steppedDown = true; applyTier(); toast('Grafik automatisch reduziert · Quality stepped down'); } sampleMs = 0; sampleN = 0; }
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const fontsReady = Promise.race([
  Promise.all(['800 140px Barlow', '700 38px Barlow', '700 50px "Barlow Semi Condensed"', '500 24px "IBM Plex Mono"'].map((f) => document.fonts.load(f))),
  new Promise((r) => setTimeout(r, 2500)),
]);
fontsReady.then(() => { buildBoards(); applyTier(); frame(); });
</script>
</body>
</html>

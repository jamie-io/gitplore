# Static hosting for the Angular app (IMPLEMENTATION_PLAN.md §9).
#
# - SPA fallback: unknown paths serve index.html, so deep links like /p/<slug> work.
# - Hashed build files are cached for a year; index.html and content never are.
# - No Cross-Origin-* headers: the demo iframes must keep working.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript
    image/svg+xml text/markdown model/gltf-binary;
  gzip_min_length 1024;
  gzip_vary on;

  # A `types` block here would replace the default map, so pull that in first and extend it.
  include /etc/nginx/mime.types;
  types {
    model/gltf-binary glb;
    text/markdown md;
  }

  # Angular emits hashed file names for everything under the root except index.html.
  location ~* \.(js|css|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Assets and READMEs change without a hash: revalidate on every visit.
  location ~ ^/(assets|content)/ {
    add_header Cache-Control "public, no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

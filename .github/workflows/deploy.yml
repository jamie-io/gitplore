name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The only thing that changes when we move from GitHub Pages to our own nginx (§9).
  BASE_HREF: /gitplore/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # M2 adds `npm run content:sync`, M4 adds `npm run content:check` here.
      - run: npm run lint
      - run: npm test
      - run: npx ng build --base-href "$BASE_HREF"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/gitplore/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
